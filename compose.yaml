services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-fantrack}
      POSTGRES_USER: ${PGUSER:-fantrack}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - fantrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fantrack-postgres-data:
