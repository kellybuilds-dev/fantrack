<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | FANTRACK</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            padding: 20px 24px;
            border-bottom: 1px solid #25252d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #8b5cf6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 28px 24px 56px;
        }

        .back {
            display: inline-block;
            color: #a1a1aa;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: white;
        }

        .back:focus-visible,
        .notification a:focus-visible,
        .notification button:focus-visible,
        .mark-all:focus-visible,
        .empty-state a:focus-visible {
            outline: 3px solid #c4b5fd;
            outline-offset: 3px;
        }

        .page-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin: 34px 0 24px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 36px);
            line-height: 1.15;
        }

        .page-heading p {
            margin: 9px 0 0;
            color: #a1a1aa;
            line-height: 1.5;
        }

        .unread-summary {
            flex: 0 0 auto;
            padding: 9px 13px;
            border: 1px solid #49386a;
            border-radius: 999px;
            background: #1b1725;
            color: #d7c5ff;
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .list-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 42px;
            margin-bottom: 8px;
        }

        .list-toolbar h2 {
            margin: 0;
            font-size: 18px;
        }

        .mark-all {
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid #8b5cf6;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .mark-all:hover:not(:disabled) {
            border-color: #7441df;
            background: #7441df;
        }

        .mark-all:disabled {
            cursor: default;
            opacity: 0.55;
        }

        .notification {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 15px;
            margin-top: 13px;
            padding: 19px;
            border: 1px solid #30283f;
            border-radius: 16px;
            background: #15151c;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .notification.is-unread {
            border-color: #59417e;
            background: linear-gradient(110deg, #1d1828, #15151c 60%);
            box-shadow: inset 3px 0 #8b5cf6;
        }

        .notification.is-read {
            border-color: #272731;
        }

        .notification-icon {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid #49386a;
            border-radius: 13px;
            background: #241a3a;
            font-size: 20px;
        }

        .notification-content {
            min-width: 0;
        }

        .notification h3 {
            margin: 0;
            font-size: 17px;
            line-height: 1.4;
        }

        .notification p {
            margin: 8px 0 0;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        .notification-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: 12px;
        }

        .tag,
        .read-status {
            display: inline-flex;
            align-items: center;
            min-height: 25px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .tag {
            border: 1px solid #49386a;
            background: #241a3a;
            color: #d7c5ff;
        }

        .tag--music {
            border-color: #49386a;
            background: #241a3a;
            color: #d7c5ff;
        }

        .tag--event {
            border-color: #164e63;
            background: #112630;
            color: #67e8f9;
        }

        .tag--award {
            border-color: #713f12;
            background: #2a1d11;
            color: #fbbf24;
        }

        .tag--news {
            border-color: #334155;
            background: #1e293b;
            color: #bfdbfe;
        }

        .tag--merch {
            border-color: #14532d;
            background: #14251a;
            color: #86efac;
        }

        .read-status {
            border: 1px solid #5b3c19;
            background: #2a1d11;
            color: #fbbf24;
        }

        .is-read .read-status {
            border-color: #3f3f46;
            background: #202024;
            color: #a1a1aa;
        }

        .notification-date {
            color: #71717a;
            font-size: 13px;
        }

        .notification-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-top: 14px;
        }

        .notification-actions a,
        .notification-actions button {
            color: #c4b5fd;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .notification-actions a:hover,
        .notification-actions button:hover {
            color: white;
        }

        .notification-actions button {
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .notification-actions button[hidden] {
            display: none;
        }

        .empty-state {
            margin-top: 14px;
            padding: 28px 22px;
            border: 1px solid #30283f;
            border-radius: 16px;
            background: linear-gradient(120deg, #1b1725, #15151c);
            text-align: center;
        }

        .empty-state h2 {
            margin: 0;
            font-size: 20px;
        }

        .empty-state p {
            max-width: 500px;
            margin: 9px auto 0;
            color: #a1a1aa;
            line-height: 1.55;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 16px;
            color: #c4b5fd;
            font-weight: 700;
            text-decoration: none;
        }

        .empty-state a:hover {
            color: white;
        }

        .status-message {
            min-height: 1.5em;
            margin: 12px 0 0;
            color: #c4b5fd;
            font-size: 14px;
        }

        .status-message:empty {
            display: none;
        }

        @media (max-width: 600px) {
            header {
                padding: 17px 16px;
            }

            .container {
                padding: 24px 16px 42px;
            }

            .page-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 14px;
                margin: 28px 0 21px;
            }

            .list-toolbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 12px;
            }

            .mark-all {
                width: 100%;
            }

            .notification {
                grid-template-columns: 36px minmax(0, 1fr);
                gap: 11px;
                padding: 15px 13px;
            }

            .notification-icon {
                width: 36px;
                height: 36px;
                border-radius: 11px;
                font-size: 17px;
            }

            .notification h3 {
                font-size: 16px;
            }

            .notification-actions {
                gap: 12px 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">FAN<span>TRACK</span></div>
</header>

<main class="container">

    <a class="back" href="index.html">← Back to FANTRACK</a>

    <section class="page-heading" aria-labelledby="notificationsTitle">
        <div>
            <h1 id="notificationsTitle">🔔 Notifications</h1>
            <p>Updates from the artists you follow.</p>
        </div>
        <div class="unread-summary" id="unreadSummary" aria-live="polite">0 unread</div>
    </section>

    <section aria-labelledby="notificationListTitle">
        <div class="list-toolbar">
            <h2 id="notificationListTitle">Your updates</h2>
            <button class="mark-all" id="retryNotifications" type="button" hidden>
                Retry
            </button>
            <button class="mark-all" id="markAllRead" type="button">
                ✓ Mark all as read
            </button>
        </div>
        <p class="status-message" id="notificationStatus" role="status" aria-live="polite"></p>
        <div id="notificationsList" aria-live="polite"></div>
    </section>

</main>
<script src="fantrack-state.js"></script>
<script src="fantrack-api.js"></script>
<script src="fantrack-follow.js"></script>
<script>
    if (!window.FantrackState || !window.FantrackApi || !window.FantrackFollow) {
        throw new Error("FANTRACK notification scripts failed to load.");
    }

    const notificationsList =
        document.getElementById("notificationsList");
    const markAllRead = document.getElementById("markAllRead");
    const retryNotifications =
        document.getElementById("retryNotifications");
    const unreadSummary = document.getElementById("unreadSummary");
    const notificationStatus = document.getElementById("notificationStatus");
    const knownArtists = [
        {
            id: "burna-boy",
            name: "Burna Boy"
        },
        {
            id: "rema",
            name: "Rema"
        },
        {
            id: "tems",
            name: "Tems"
        },
        {
            id: "drake",
            name: "Drake"
        },
        {
            id: "wizkid",
            name: "Wizkid"
        },
        {
            id: "davido",
            name: "Davido"
        }
    ];
    let artists = knownArtists.slice();
    let updates = [];
    let notifications = [];
    let followedArtists = [];
    let unreadCount = 0;
    let isLoading = false;
    const categoryDetails = {
        music: { icon: "🎵", label: "Music" },
        event: { icon: "🎤", label: "Events" },
        award: { icon: "🏆", label: "Awards" },
        news: { icon: "📰", label: "News" },
        merch: { icon: "🛍️", label: "Merch" }
    };

    function getUpdateDetailUrl(artistId, update) {
        const params = new URLSearchParams({
            artist: artistId,
            type: update.type,
            title: update.title
        });
        return "update.html?" + params.toString();
    }

    function updateUnreadSummary() {
        unreadCount = notifications.filter(function (notification) {
            return !notification.isRead;
        }).length;
        unreadSummary.textContent = unreadCount + " unread";
        markAllRead.hidden = unreadCount === 0;
        markAllRead.disabled = isLoading;
    }

    function createEmptyState(title, description, linkText, linkHref) {
        const emptyState = document.createElement("section");
        emptyState.className = "empty-state";

        const heading = document.createElement("h2");
        heading.textContent = title;
        emptyState.appendChild(heading);

        const message = document.createElement("p");
        message.textContent = description;
        emptyState.appendChild(message);

        if (linkText) {
            const link = document.createElement("a");
            link.href = linkHref;
            link.textContent = linkText;
            emptyState.appendChild(link);
        }

        return emptyState;
    }

    function updateNotificationCard(card, isRead, artist, update) {
        card.classList.toggle("is-read", isRead);
        card.classList.toggle("is-unread", !isRead);
        card.setAttribute("aria-label", isRead
            ? "Read notification from " + artist.name + ": " + update.title
            : "Unread notification from " + artist.name + ": " + update.title);

        const readStatus = card.querySelector(".read-status");
        readStatus.textContent = isRead ? "Read" : "Unread";
        readStatus.setAttribute("aria-label", isRead
            ? "Notification read"
            : "Notification unread");

        const markReadButton = card.querySelector(".mark-one-read");
        markReadButton.hidden = isRead;
    }

    function buildNotifications() {
        const artistById = new Map(
            artists.map(function (artist) {
                return [artist.id, artist];
            })
        );
        updates.forEach(function (update) {
            artistById.set(update.artistId, {
                id: update.artistId,
                name: update.artistName
            });
        });
        artists = Array.from(artistById.values());

        const followedIds = new Set(
            FantrackFollow.getFollowedArtistIds(artists)
        );
        followedArtists = artists.filter(function (artist) {
            return followedIds.has(artist.id);
        });

        notifications = updates
            .filter(function (update) {
                return followedIds.has(update.artistId) &&
                    FantrackState.isAlertEnabled(
                        update.artistId,
                        update.type
                    );
            })
            .map(function (update) {
                const artist = artistById.get(update.artistId);
                return {
                    artist: artist,
                    update: {
                        id: update.id,
                        type: update.type,
                        title: update.title,
                        description: update.description,
                        date: update.date,
                        link: update.link
                    },
                    isRead: FantrackState.isNotificationRead(
                        update.artistId,
                        update.type,
                        update.title
                    )
                };
            });
    }

    function renderNotifications() {
        buildNotifications();
        updateUnreadSummary();
        notificationsList.replaceChildren();

        if (notifications.length === 0) {
            if (followedArtists.length === 0) {
                notificationsList.appendChild(createEmptyState(
                    "❤️ No followed artists yet",
                    "Follow your favorite artists to receive their updates.",
                    "Explore artists →",
                    "index.html#artistDiscovery"
                ));
            } else {
                const artistProfile =
                    "artist.html?artist=" + encodeURIComponent(followedArtists[0].id);
                notificationsList.appendChild(createEmptyState(
                    "🔔 No eligible notifications yet",
                    "There are no updates matching your followed artists and alert preferences.",
                    "Manage " + followedArtists[0].name + " alerts →",
                    artistProfile
                ));
            }
            return;
        }

        if (unreadCount === 0) {
            notificationsList.appendChild(createEmptyState(
                "✓ You're all caught up",
                "You've read all the available notifications from artists you follow."
            ));
        }

        notifications.forEach(function (notification) {
            const artist = notification.artist;
            const update = notification.update;
            const category = categoryDetails[update.type] || {
                icon: "⚡",
                label: update.type
            };

            const card = document.createElement("article");
            card.className = "notification";

            const icon = document.createElement("div");
            icon.className = "notification-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = category.icon;
            card.appendChild(icon);

            const content = document.createElement("div");
            content.className = "notification-content";

            const heading = document.createElement("h3");
            heading.textContent = artist.name + " — " + update.title;
            content.appendChild(heading);

            const description = document.createElement("p");
            description.textContent = update.description;
            content.appendChild(description);

            const meta = document.createElement("div");
            meta.className = "notification-meta";

            const categoryTag = document.createElement("span");
            categoryTag.className = "tag tag--" + update.type;
            categoryTag.textContent = category.label;
            meta.appendChild(categoryTag);

            const readStatus = document.createElement("span");
            readStatus.className = "read-status";
            meta.appendChild(readStatus);

            const date = document.createElement("span");
            date.className = "notification-date";
            date.textContent = update.date;
            meta.appendChild(date);
            content.appendChild(meta);

            const actions = document.createElement("div");
            actions.className = "notification-actions";

            const viewLink = document.createElement("a");
            viewLink.href = getUpdateDetailUrl(artist.id, update);
            viewLink.textContent = "View Update →";
            viewLink.addEventListener("click", function () {
                if (!FantrackState.isNotificationRead(
                    artist.id,
                    update.type,
                    update.title
                )) {
                    FantrackState.markNotificationRead(
                        artist.id,
                        update.type,
                        update.title
                    );
                    notification.isRead = true;
                    updateNotificationCard(card, true, artist, update);
                    updateUnreadSummary();
                }
            });
            actions.appendChild(viewLink);

            const markReadButton = document.createElement("button");
            markReadButton.className = "mark-one-read";
            markReadButton.type = "button";
            markReadButton.textContent = "Mark as read";
            markReadButton.setAttribute(
                "aria-label",
                "Mark " + artist.name + " — " + update.title + " as read"
            );
            markReadButton.addEventListener("click", function () {
                if (FantrackState.isNotificationRead(
                    artist.id,
                    update.type,
                    update.title
                )) {
                    updateNotificationCard(card, true, artist, update);
                    return;
                }

                FantrackState.markNotificationRead(
                    artist.id,
                    update.type,
                    update.title
                );
                renderNotifications();
                notificationStatus.textContent =
                    "Marked " + artist.name + " — " + update.title + " as read.";
            });
            actions.appendChild(markReadButton);

            content.appendChild(actions);
            card.appendChild(content);
            updateNotificationCard(card, notification.isRead, artist, update);
            notificationsList.appendChild(card);
        });
    }

    function showUnavailable(title, message) {
        notificationsList.replaceChildren();
        const errorState = document.createElement("section");
        errorState.className = "empty-state";
        errorState.setAttribute("role", "alert");

        const heading = document.createElement("h2");
        heading.textContent = title;
        errorState.appendChild(heading);

        const description = document.createElement("p");
        description.textContent = message;
        errorState.appendChild(description);
        notificationsList.appendChild(errorState);

        unreadSummary.textContent = "Notifications unavailable";
        markAllRead.hidden = true;
        markAllRead.disabled = true;
        retryNotifications.hidden = false;
        notificationStatus.textContent = "";
    }

    async function loadNotifications() {
        if (isLoading) {
            return;
        }
        isLoading = true;
        retryNotifications.hidden = true;
        retryNotifications.disabled = true;
        markAllRead.hidden = true;
        markAllRead.disabled = true;
        unreadSummary.textContent = "Loading...";
        notificationStatus.textContent = "Loading notifications...";
        notificationsList.replaceChildren();
        const loadingMessage = document.createElement("p");
        loadingMessage.className = "status-message";
        loadingMessage.setAttribute("role", "status");
        loadingMessage.textContent = "Loading notifications...";
        notificationsList.appendChild(loadingMessage);

        try {
            try {
                await FantrackFollow.initialize();
            } catch {
                showUnavailable(
                    "Unable to load notification follows",
                    "Follow state is temporarily unavailable. Please try again."
                );
                return;
            }

            try {
                updates = await FantrackApi.getUpdates();
            } catch {
                showUnavailable(
                    "Unable to load notifications",
                    "FANTRACK updates are temporarily unavailable. Please try again."
                );
                return;
            }

            notificationStatus.textContent = "";
            renderNotifications();
        } finally {
            isLoading = false;
            retryNotifications.disabled = false;
            markAllRead.disabled = false;
        }
    }

    retryNotifications.addEventListener("click", loadNotifications);

    markAllRead.addEventListener("click", function () {
        if (isLoading || unreadCount === 0) {
            return;
        }
        notifications.forEach(function (notification) {
            if (!notification.isRead) {
                FantrackState.markNotificationRead(
                    notification.artist.id,
                    notification.update.type,
                    notification.update.title
                );
            }
        });
        renderNotifications();
        notificationStatus.textContent = "All notifications marked as read.";
    });

    loadNotifications();
</script>
</body>
</html>
